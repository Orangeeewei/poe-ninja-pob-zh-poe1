name: Update PoE1 translation data

# 每日重建 PoE1 翻譯資料(data/)與遊戲數值(gamedata/)。
#
# ★ 步驟表不寫在這裡 —— 一律呼叫 repo 根的 update-poe1.mjs。
#   那支是本機手動更新與 MCP 開機自檢共用的流程(已實測 9 步全過),
#   包含 patch 變更偵測、--all 全表匯出、§12 新結構偵測、soft 失敗處理。
#   若在 YAML 裡重抄一份步驟,兩邊遲早漂移(同 gen-config.mjs 的單一事實來源原則)。
#   要增刪步驟,改 update-poe1.mjs 即可,這個檔不用動。

on:
  schedule:
    - cron: '0 19 * * *'   # 每天 UTC 19:00(台灣 03:00);與 PoE2 版的 18:00 錯開一小時,
                           # 避免兩個 repo 同時打 GGG patch server 與 poedb
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-dict
  cancel-in-progress: false   # 解包很耗時,寧可排隊也不要中途砍掉

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        # .last-patch 由上一輪 commit 帶回來,update-poe1.mjs 靠它判斷要不要完整重建。
        # 若沒帶回,每輪都會被當成新 patch 而重跑最耗時的解包。

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安裝 pathofexile-dat
        working-directory: tools/data-export
        run: npm install --no-audit --no-fund

      # 一鍵更新:patch 偵測 →(新版才)重建遊戲匯出 → poedb 名稱 → 版本 →
      # RePoE 數值 → PoB 傳奇 → 前瞻 → (soft)天賦樹/交易詞綴/命運卡/掉落來源。
      #
      # runner 上必定會 soft-fail 的步驟(不影響整體,屬預期):
      #   ・抽取天賦樹 —— 讀本機 PoB 安裝路徑,CI 上沒有
      #   ・更新交易詞綴對照 —— pathofexile.com API 對非瀏覽器 UA 回 403(Cloudflare)
      - name: 更新 PoE1 資料
        run: node update-poe1.mjs

      - name: 提交更新
        run: |
          # 只提交資料產物:update.log 之類的執行期檔案不進版控。
          # .last-patch 一定要一起提交,否則下一輪會誤判為新 patch。
          git add -A data/ gamedata/ .last-patch
          if git diff --cached --quiet; then
            echo "資料沒有變動，略過。"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          PATCH=$(cd tools/data-export && node get-patch.mjs || echo unknown)
          git commit -m "chore: 自動更新 PoE1 翻譯資料(patch ${PATCH})"
          git push
          echo "已更新並推送。"

      # 稽核(資訊用,continue-on-error → 絕不影響每日 build)。
      # 全表掃描,把「有官方繁中卻還沒對接」的欄位印在 log;每次改版看一眼,
      # 若有新出現、相關的欄位,人工加進 relevance.mjs 即可。
      - name: 稽核未對接的中文欄位(資訊)
        if: always()
        continue-on-error: true
        working-directory: tools/data-export
        run: |
          PATCH=$(node get-patch.mjs) || exit 0
          export PATCH
          node gen-config.mjs --all
          node node_modules/pathofexile-dat/dist/cli/run.js
          node audit-coverage.mjs
